<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Тест</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<pre id="testlog">RUNNING</pre>
<script src="assets/js/app.js"></script>
<script>
  const L = [];
  let fails = 0;
  const nb = (s) => String(s).replace(/\u00A0/g, ' ');
  const txt = (id) => nb(document.getElementById(id).textContent);
  const active = () => {
    const el = document.querySelector('.screen.is-active');
    return el ? el.id : 'NONE';
  };
  const check = (name, got, want) => {
    const ok = String(got) === String(want);
    if (!ok) fails++;
    L.push((ok ? 'PASS ' : 'FAIL ') + name + ' | got=' + got + (ok ? '' : ' want=' + want));
  };
  const step = (name) => L.push('--- ' + name + ' ---');

  step('1. Стартовый экран');
  check('активен лендинг', active(), 'screen-landing');

  step('2. Переход: лендинг -> форма записи');
  document.querySelector('#screen-landing [data-go="booking"]').click();
  check('открылась форма записи', active(), 'screen-booking');
  check('кнопка подтверждения заблокирована', document.getElementById('confirm-btn').disabled, 'true');

  step('3. Выбор услуг');
  document.querySelector('#service-options input[value="s1"]').click();
  check('выбрана 1 услуга', document.querySelectorAll('#service-options .option.is-selected').length, 1);
  check('итого после 1 услуги', txt('summary-price'), '2 500 ₽');
  document.querySelector('#service-options input[value="s3"]').click();
  check('выбрано 2 услуги', document.querySelectorAll('#service-options .option.is-selected').length, 2);
  check('итого после 2 услуг', txt('summary-price'), '4 300 ₽');
  check('длительность 105 мин', txt('tz-duration'), '105');

  step('4. Фильтр мастеров по услугам');
  const mCount = document.querySelectorAll('#master-options input[name="master"]').length;
  check('доступно мастеров (2 услуги + любой)', mCount, 3);
  document.querySelector('#master-options input[value="m1"]').click();
  check('мастер выбран', document.querySelectorAll('#master-options .is-selected').length, 1);
  check('даты отрисованы', document.querySelectorAll('#date-strip .date').length, 7);
  check('слоты не отрисованы без даты', document.querySelectorAll('#slot-grid .slot').length, 0);

  step('5. Выбор даты');
  const openDay = [...document.querySelectorAll('#date-strip .date')].find((b) => !b.disabled && !b.classList.contains('is-unavailable'));
  openDay.click();
  check('выбрана дата', document.querySelectorAll('#date-strip .date.is-selected').length, 1);
  check('слотов отрисовано', document.querySelectorAll('#slot-grid .slot').length, 12);
  const busy = document.querySelectorAll('#slot-grid .slot[disabled]').length;
  check('часть слотов занята', busy > 0 ? 'да' : 'нет', 'да');
  check('занятые слоты некликабельны', document.querySelectorAll('#slot-grid .slot.is-selected[disabled]').length, 0);

  step('6. Выбор времени');
  const free = [...document.querySelectorAll('#slot-grid .slot')].find((b) => !b.disabled);
  free.click();
  check('слот выделен', document.querySelectorAll('#slot-grid .slot.is-selected').length, 1);
  check('кнопка подтверждения активна', document.getElementById('confirm-btn').disabled, 'false');
  check('таймер резерва показан', document.getElementById('summary-timer').hidden, 'false');

  step('7. Переход: форма -> подтверждение');
  document.getElementById('confirm-btn').click();
  check('открылось подтверждение', active(), 'screen-confirmation');
  check('услуга', txt('confirm-service'), 'Мужская стрижка, Бритьё бороды');
  check('мастер', txt('confirm-master'), 'Артём Волков');
  check('дата', txt('confirm-date').length > 0 ? 'заполнена' : 'пусто', 'заполнена');
  check('время', txt('confirm-time'), free.textContent);
  check('стоимость', txt('confirm-price'), '4 300 ₽');
  check('длительность', txt('confirm-duration'), '105 минут');
  check('номер записи', /^TB-\d{4}$/.test(txt('confirm-id')), 'true');

  step('8. Обратные переходы');
  document.querySelector('#screen-confirmation [data-go="booking"]').click();
  check('вернулись к форме', active(), 'screen-booking');
  check('выборы сохранились', document.querySelectorAll('#slot-grid .slot.is-selected').length, 1);
  document.querySelector('#screen-booking [data-go="landing"]').click();
  check('вернулись на лендинг', active(), 'screen-landing');

  step('Итог');
  L.push(fails === 0 ? 'ALL TESTS PASSED' : 'FAILED: ' + fails);
  document.getElementById('testlog').textContent = L.join('\n');
</script>
</body>
</html>
